<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #e5e5e5;
      width: 300px;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .header span { font-size: 18px; }
    .status {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #aaa;
    }
    .status .name { color: #fff; font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .status .email { color: #888; font-size: 11px; }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-fill {
      background: #16a34a;
      color: #fff;
    }
    .btn-sync {
      background: #1e3a5f;
      color: #93c5fd;
    }
    .btn-clear {
      background: #2a1515;
      color: #f87171;
    }
    .msg {
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 4px;
      display: none;
    }
    .msg.success { background: #14532d; color: #86efac; display: block; }
    .msg.error { background: #450a0a; color: #fca5a5; display: block; }
    .msg.info { background: #1e3a5f; color: #93c5fd; display: block; }
    .divider { border: none; border-top: 1px solid #2a2a3a; margin: 10px 0; }
    .cover-section { margin-top: 4px; }
    .cover-label { font-size: 11px; color: #888; margin-bottom: 6px; }
    textarea {
      width: 100%;
      height: 80px;
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #e5e5e5;
      font-size: 11px;
      padding: 8px;
      resize: vertical;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🦄</span>
    <h1>Job Autopilot Filler</h1>
  </div>

  <div class="status" id="profileStatus">
    <div class="name" id="profileName">No profile loaded</div>
    <div class="email" id="profileEmail">Sync profile to get started</div>
  </div>

  <button class="btn btn-fill" id="btnFill">⚡ Fill This Application</button>
  <button class="btn btn-sync" id="btnSync">🔄 Sync Profile from Autopilot</button>

  <div class="cover-section">
    <div class="cover-label">Cover letter (paste from Applications tab if needed):</div>
    <textarea id="coverLetterInput" placeholder="Paste cover letter here to auto-fill cover letter fields..."></textarea>
  </div>

  <hr class="divider">
  <button class="btn btn-clear" id="btnClear">🗑 Clear Saved Profile</button>

  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
